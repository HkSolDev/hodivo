name: CI Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aptus_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aptus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aptus_ci -d aptus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aptus_ci:ci-only-password@127.0.0.1:5432/aptus_ci
      TEST_DATABASE_URL: postgresql://aptus_ci:ci-only-password@127.0.0.1:5432/aptus_ci
      APTUS_SEARCH_TEST_DATABASE_URL: postgresql://aptus_ci:ci-only-password@127.0.0.1:5432/aptus_search_fixture
      AUTH_ENABLED: 'false'
      DOTENV_CONFIG_PATH: /dev/null
      PYTHONPATH: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/ai/requirements.txt

      - run: pnpm install --frozen-lockfile
      - name: Install offline Python test dependencies
        run: |
          python -m venv services/ai/.venv
          services/ai/.venv/bin/pip install -r services/ai/requirements.txt
      - name: Prepare disposable test database
        run: |
          pnpm exec prisma migrate deploy --config prisma7.config.ts
          node --input-type=module -e "import pg from 'pg'; const db = new pg.Client({ connectionString: process.env.DATABASE_URL }); await db.connect(); await db.query('CREATE DATABASE aptus_search_fixture'); await db.end();"
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=low
      - name: Lint
        run: pnpm lint
      - name: Formatting
        if: ${{ !cancelled() }}
        run: pnpm exec prettier --check .
      - name: Type checking
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Frozen contract and consumer audit checks
        if: ${{ !cancelled() }}
        run: pnpm check:contracts
      - name: Node and database tests
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: Offline Python tests
        if: ${{ !cancelled() }}
        run: services/ai/.venv/bin/python -m unittest discover -s services/ai/tests -q

  web-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aptus_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aptus_ci
        options: >-
          --health-cmd "pg_isready -U aptus_ci -d aptus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aptus_ci:ci-only-password@postgres:5432/aptus_ci
      TEST_DATABASE_URL: postgresql://aptus_ci:ci-only-password@postgres:5432/aptus_ci
      APTUS_SEARCH_TEST_DATABASE_URL: postgresql://aptus_ci:ci-only-password@postgres:5432/aptus_search_fixture
      AUTH_ENABLED: 'false'
      DOTENV_CONFIG_PATH: /dev/null
      PYTHONPATH: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pnpm install --frozen-lockfile
      - name: Install offline Python test dependencies
        run: |
          python -c "import ssl; print(ssl.OPENSSL_VERSION)"
          python -m venv services/ai/.venv
          services/ai/.venv/bin/python -m pip install -r services/ai/requirements.txt
      - name: Prepare disposable test database
        run: |
          pnpm exec prisma migrate deploy --config prisma7.config.ts
          node --input-type=module -e "import pg from 'pg'; const db = new pg.Client({ connectionString: process.env.DATABASE_URL }); await db.connect(); await db.query('CREATE DATABASE aptus_search_fixture'); await db.end();"
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - name: Build web and Next.js
        run: pnpm build:web && pnpm next:build
      - name: Browser and frontend tests (shard ${{ matrix.shard }}/2)
        run: |
          ALL_TESTS=(tests/*.test.ts tests/saved-workspace.test.mjs tests/frontend-malformed-browser.test.mjs)
          SHARD_TESTS=()
          for idx in "${!ALL_TESTS[@]}"; do
            if (( (idx % 2) + 1 == ${{ matrix.shard }} )); then
              SHARD_TESTS+=("${ALL_TESTS[$idx]}")
            fi
          done
          node --import ./tests/css-module-hook.mjs --import tsx --test --test-concurrency=1 "${SHARD_TESTS[@]}"

  test:
    runs-on: ubuntu-latest
    needs: [checks-and-unit, web-tests]
    if: always()
    steps:
      - name: Verify checks-and-unit and web-tests passed
        run: |
          if [[ "${{ needs.checks-and-unit.result }}" != "success" || "${{ needs.web-tests.result }}" != "success" ]]; then
            echo "checks-and-unit: ${{ needs.checks-and-unit.result }}"
            echo "web-tests: ${{ needs.web-tests.result }}"
            exit 1
          fi

  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build API runtime image
        run: docker build -f deployment/api.Dockerfile -t aptus-api:ci .
      - name: Check API container startup
        run: |
          docker run -d --name aptus-api-smoke --network none -e AUTH_ENABLED=false aptus-api:ci
          for attempt in $(seq 1 30); do
            if docker exec aptus-api-smoke node -e "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          docker logs aptus-api-smoke
          exit 1
      - name: Remove smoke container
        if: always()
        run: docker rm -f aptus-api-smoke || true

  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build worker runtime image
        run: docker build -f deployment/worker.Dockerfile -t aptus-worker:ci .
      - name: Check worker help without running the pipeline
        run: docker run --rm --network none --read-only aptus-worker:ci --help

  frontend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend runtime image
        run: docker build -f deployment/frontend.Dockerfile -t aptus-frontend:ci .
      - name: Check frontend container startup
        run: |
          docker run -d --name aptus-frontend-smoke --network none aptus-frontend:ci
          for attempt in $(seq 1 30); do
            if docker exec aptus-frontend-smoke node -e "fetch('http://127.0.0.1:3000/how-it-works').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          docker logs aptus-frontend-smoke
          exit 1
      - name: Remove smoke container
        if: always()
        run: docker rm -f aptus-frontend-smoke || true
