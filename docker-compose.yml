services:
  slave-db:
    image: postgres:18-alpine
    container_name: hodivo-slave-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aptus
      POSTGRES_PASSWORD: aptus
      POSTGRES_DB: aptus_slave
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - slave_db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aptus -d aptus_slave']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  slave_db_data:
